name: argano-guard
# Runs on PRs into the argano branch of the Argano fork. Refuses added lines that carry a real
# Salesforce record Id (18-character, case-safe checksum) or an em dash in Markdown. Generic build
# source and tooling only live here; anything client-derived belongs in the private RCVA repo.
on:
  pull_request:
    branches: [argano]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Scan added lines
        run: |
          python3 - "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" <<'PY'
          import re, subprocess, sys
          base, head = sys.argv[1:3]
          diff = subprocess.run(["git", "diff", "--unified=0", base, head], capture_output=True, text=True).stdout
          A = "ABCDEFGHIJKLMNOPQRSTUVWXYZ012345"
          def cs(i): return "".join(A[sum(1 << k for k, c in enumerate(ch) if c.isupper())] for ch in (i[:5], i[5:10], i[10:15]))
          path, bad = None, []
          for line in diff.splitlines():
              if line.startswith("+++ "): path = line[6:]; continue
              if not line.startswith("+") or line.startswith("+++"): continue
              body = line[1:]
              for cand in re.findall(r"(?<![0-9A-Za-z])[0-9A-Za-z]{18}(?![0-9A-Za-z])", body):
                  if cand[15:] == cs(cand[:15]): bad.append(f"{path}: Salesforce Id {cand}")
              if path and path.endswith(".md") and "—" in body: bad.append(f"{path}: em dash")
          if bad:
              print("\n".join(sorted(set(bad)))); sys.exit(1)
          print("argano-guard: clean")
          PY
